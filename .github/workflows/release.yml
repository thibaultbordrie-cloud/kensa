name: release

# Builds the binaries when a release is published and attaches them to it.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            file: kensa
          - os: macos-latest
            target: aarch64-apple-darwin
            file: kensa
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            file: kensa.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="kensa-${{ github.event.release.tag_name }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/${{ matrix.file }}" README.md LICENSE "$name/"
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$name.zip" "$name" > /dev/null; echo "ASSET=$name.zip" >> "$GITHUB_ENV";
          else tar czf "$name.tar.gz" "$name"; echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"; fi
      - name: Upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "$ASSET" --clobber
